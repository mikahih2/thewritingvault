<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#2B2620"/>

  <g stroke="#2B2620" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail bumps peeking in from the bottom -->
    <circle cx="62" cy="176" r="24" fill="#AFC098"/>
    <circle cx="48" cy="142" r="27" fill="#93A67A"/>

    <!-- head -->
    <circle cx="108" cy="98" r="58" fill="#D3AC72"/>

    <!-- antenna -->
    <path d="M128 46 Q140 26 122 22" fill="none" stroke="#93A67A" stroke-width="6"/>
    <circle cx="122" cy="22" r="7" fill="#93A67A" stroke="#2B2620" stroke-width="4"/>

    <!-- glasses -->
    <circle cx="88" cy="98" r="20" fill="none" stroke="#2B2620" stroke-width="6"/>
    <circle cx="132" cy="98" r="20" fill="none" stroke="#2B2620" stroke-width="6"/>
    <line x1="108" y1="98" x2="112" y2="98" stroke="#2B2620" stroke-width="6"/>

    <!-- eyes -->
    <circle cx="88" cy="100" r="6" fill="#2B2620" stroke="none"/>
    <circle cx="132" cy="100" r="6" fill="#2B2620" stroke="none"/>

    <!-- blush -->
    <circle cx="68" cy="118" r="7" fill="#D97C8C" opacity="0.8" stroke="none"/>
    <circle cx="152" cy="118" r="7" fill="#D97C8C" opacity="0.8" stroke="none"/>

    <!-- smile -->
    <path d="M94 128 Q110 140 126 128" fill="none" stroke="#2B2620" stroke-width="6"/>
  </g>
</svg>
