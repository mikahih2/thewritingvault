import React, { useState, useEffect, useCallback, useRef } from "react";

// A drop-in replacement for the Claude-artifact storage API, backed by the
// browser's own localStorage — this is what makes the app work as a real,
// standalone website instead of only inside a Claude chat.
const storage = {
  async get(key) {
    const value = localStorage.getItem(key);
    if (value === null) return null;
    return { key, value };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

const SPINE_COLORS = ["#C15C6E", "#93A67A", "#D3AC72", "#5B84A6", "#A6708F", "#7A9166"];

const STATUSES = ["Brainstorming", "Drafting", "In Progress"];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Downscales and compresses an image file/blob to a reasonably small JPEG data
// URL, so uploaded or pasted moodboard photos don't bloat storage. Uses
// FileReader (data: URLs) rather than URL.createObjectURL (blob: URLs), since
// blob: URLs can be blocked by this environment's sandboxing.
function compressImageToDataURL(blob, maxDim = 1000, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error("Could not read file"));
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        try {
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = () => reject(new Error("Could not load image data"));
      img.src = reader.result;
    };
    reader.readAsDataURL(blob);
  });
}
// Formats a Date using its LOCAL calendar day, not UTC — Date.toISOString()
// always returns the UTC date, which can silently shift an evening writing
// session onto the wrong day for anyone west of UTC (or the next day for
// anyone east of it late at night).
const localISO = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const todayISO = () => localISO(new Date());
const countWords = (t) => (t && t.trim() ? t.trim().split(/\s+/).length : 0);
const totalWordsForProject = (p) => (p.scenes || []).reduce((sum, s) => sum + countWords(s.content), 0);

function computeStreak(log) {
  if (!log) return 0;
  const day = 24 * 60 * 60 * 1000;
  let cursor = new Date();
  cursor.setHours(0, 0, 0, 0);
  const iso = localISO;
  // if nothing logged today yet, streak can still be "alive" starting from yesterday
  if (!log[iso(cursor)]) {
    cursor = new Date(cursor.getTime() - day);
    if (!log[iso(cursor)]) return 0;
  }
  let count = 0;
  while (log[iso(cursor)]) {
    count += 1;
    cursor = new Date(cursor.getTime() - day);
  }
  return count;
}

const blankProject = (name, color, genre) => ({
  name,
  color,
  genre: genre || "",
  characters: [],
  timeline: [],
  wiki: [],
  scenes: [],
  history: [],
  characterMapPositions: {},
  moodboard: [],
});

const RELATIONSHIP_PRESETS = ["Family", "Love Interest"];

const relationshipColor = (label) => {
  const l = (label || "").toLowerCase();
  if (l === "family") return COLORS.sage;
  if (l === "love interest") return COLORS.wine;
  return COLORS.gold;
};

// Migrates older saved data where relationships were just an array of character ids
// into the newer { id, targetId, label } shape.
const normalizeProject = (data) => {
  if (!data) return data;
  const characters = (data.characters || []).map((c) => {
    const rels = c.relationships || [];
    const normalized = rels.map((r) =>
      typeof r === "string" ? { id: uid(), targetId: r, label: "Linked" } : r
    );
    return { ...c, relationships: normalized };
  });
  const wiki = (data.wiki || []).map((w) => ({ category: "Uncategorized", ...w }));
  const scenes = (data.scenes || []).map((s) => ({ chapter: "", ...s }));
  return { history: [], characterMapPositions: {}, moodboard: [], ...data, characters, wiki, scenes };
};

const TABS = [
  { id: "characters", label: "Characters", icon: Users },
  { id: "wiki", label: "Wiki", icon: BookOpen },
  { id: "moodboard", label: "Moodboard", icon: Images },
  { id: "timeline", label: "Timeline", icon: Clock },

];

const inputStyle = {

function AutoGrowTextarea({ value, onChange, placeholder, minHeight = 100, style }) {
  const ref = useRef(null);

  const resize = useCallback(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight, minHeight) + "px";
  }, [minHeight]);

  useEffect(() => {
    resize();
  }, [value, resize]);

  return (
    <textarea
      ref={ref}
      className="atelier-textarea"
      value={value}
      onChange={onChange}
      placeholder={placeholder}
      rows={1}
      style={{
        ...inputStyle,
        minHeight,
        resize: "none",
        overflow: "hidden",
        ...style,
      }}
    />
  );
}

export default function StoryAtelier() {
  const [view, setView] = useState("shelf");
  const [projects, setProjects] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [project, setProject] = useState(null);
  const [tab, setTab] = useState("characters");
  const [loading, setLoading] = useState(true);
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState("");
  const [newColor, setNewColor] = useState(SPINE_COLORS[0]);
  const [editorId, setEditorId] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [metaEditId, setMetaEditId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const [activityLog, setActivityLog] = useState({});
  const skipFetchRef = useRef(false);
  const saveTimerRef = useRef(null);
  const pendingSaveRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("projects-index");
        const idx = res ? JSON.parse(res.value) : [];
        setProjects(idx.map((p) => ({ status: "Brainstorming", archived: false, wordCount: 0, ...p })));
      } catch {
        setProjects([]);
      }
      try {
        const logRes = await storage.get("activity-log");
        setActivityLog(logRes ? JSON.parse(logRes.value) : {});
      } catch {
        setActivityLog({});
      }
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (!selectedId) {
      setProject(null);
      return;
    }
    if (skipFetchRef.current) {
      // we just created this project and already have its data in memory —
      // re-fetching immediately can race ahead of the write finishing.
      skipFetchRef.current = false;
      return;
    }
    (async () => {
      const attempt = async () => {
        const res = await storage.get(`project:${selectedId}`);
        return res ? JSON.parse(res.value) : null;
      };
      let data = null;
      try {
        data = await attempt();
      } catch {
        // brief retry in case of a transient read-after-write delay
        await new Promise((r) => setTimeout(r, 400));
        try {
          data = await attempt();
        } catch {
          data = null;
        }
      }
      setProject(normalizeProject(data));
      setEditorId(null);
      setTab("characters");
    })();
  }, [selectedId]);

  const persistIndex = useCallback(async (idx) => {
    const write = () => storage.set("projects-index", JSON.stringify(idx));
    try {
      await write();
    } catch (e) {
      // brief retry in case of a transient blip before giving up quietly
      await new Promise((r) => setTimeout(r, 500));
      try {
        await write();
      } catch (e2) {
        console.error("Failed to save project index", e2);
      }
    }
  }, []);

  const persistProject = useCallback(async (id, data) => {
    setSaveState("saving");
    const write = () => storage.set(`project:${id}`, JSON.stringify(data));
    try {
      await write();
      setSaveState("saved");
      setTimeout(() => setSaveState("idle"), 1200);
      return;
    } catch (e) {
      // don't flag an error yet — this is often just a transient blip
      // (e.g. a brief rate-limit) and the write may still land on retry
    }
    await new Promise((r) => setTimeout(r, 500));
    try {
      await write();
      setSaveState("saved");
      setTimeout(() => setSaveState("idle"), 1200);
    } catch (e) {
      console.error("Failed to save project after retry", e);
      setSaveState("error");
    }
  }, []);

  const updateIndexEntry = useCallback((id, patch) => {
    setProjects((idx) => {
      const next = (idx || []).map((p) => (p.id === id ? { ...p, ...patch } : p));
      persistIndex(next);
      return next;
    });
  }, [persistIndex]);

  const touchActivity = useCallback(async () => {
    const today = todayISO();
    setActivityLog((prev) => {
      if (prev[today]) return prev; // already logged, avoid redundant writes
      const next = { ...prev, [today]: true };
      storage.set("activity-log", JSON.stringify(next)).catch((e) => console.error("activity log save failed", e));
      return next;
    });
  }, []);

  const runPendingSave = useCallback(() => {
    if (saveTimerRef.current) {
      clearTimeout(saveTimerRef.current);
      saveTimerRef.current = null;
    }
    if (pendingSaveRef.current) {
      const fn = pendingSaveRef.current;
      pendingSaveRef.current = null;
      fn();
    }
  }, []);

  // updater: (prev) => next ; touchesManuscript: whether this edit should count toward the writing streak
  const updateProject = (updater, touchesManuscript = false) => {
    setProject((prev) => {
      let next = updater(prev);
      const words = totalWordsForProject(next);
      const today = todayISO();
      const history = next.history ? [...next.history] : [];
      const idx = history.findIndex((h) => h.date === today);
      if (idx >= 0) history[idx] = { date: today, words };
      else history.push({ date: today, words });
      next = { ...next, history };

      // Debounce the actual write: typing fires this constantly, and writing on
      // every keystroke can trip storage rate limits. We save ~700ms after the
      // last change instead, so a burst of typing becomes one write. The writes
      // are sequenced (not fired all at once) so they're less likely to collide.
      const idForSave = selectedId;
      pendingSaveRef.current = async () => {
        await persistProject(idForSave, next);
        updateIndexEntry(idForSave, { wordCount: words });
        if (touchesManuscript) touchActivity();
      };
      setSaveState("saving");
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      saveTimerRef.current = setTimeout(runPendingSave, 700);

      return next;
    });
  };

  const handleCreateProject = async () => {
    if (!newName.trim()) return;
    const id = uid();
    const entry = { id, name: newName.trim(), color: newColor, genre: "", status: "Brainstorming", archived: false, wordCount: 0 };
    const data = blankProject(newName.trim(), newColor);
    const idx = [...(projects || []), entry];
    setProjects(idx);
    await persistIndex(idx);
    await persistProject(id, data);
    setNewName("");
    setCreating(false);
  };

  const openProject = (id) => {
    setSelectedId(id);
    setView("workspace");
  };

  const backToShelf = () => {
    runPendingSave();
    setView("shelf");
    setSelectedId(null);
    setMetaEditId(null);
  };

  const handleDelete = async (id) => {
    const idx = (projects || []).filter((p) => p.id !== id);
    setProjects(idx);
    await persistIndex(idx);
    try {
      await storage.delete(`project:${id}`);
    } catch (e) {
      console.error("Failed to delete project data", e);
    }
    setConfirmDeleteId(null);
    setMetaEditId(null);
  };

  const addCharacter = () =>
    updateProject((p) => ({ ...p, characters: [...p.characters, { id: uid(), name: "New Character", role: "", backstory: "", traits: "", relationships: [] }] }));

  const addEvent = () =>
    updateProject((p) => ({ ...p, timeline: [...p.timeline, { id: uid(), title: "New Event", date: "", description: "", povCharId: "", linkedCharIds: [] }] }));

  const insertEvent = (index) => {
    const newId = uid();
    updateProject((p) => {
      const timeline = [...p.timeline];
      timeline.splice(index, 0, { id: newId, title: "New Event", date: "", description: "", povCharId: "", linkedCharIds: [] });
      return { ...p, timeline };
    });
    setEditorId(newId);
  };

  const addWiki = (category) =>
    updateProject((p) => ({ ...p, wiki: [...p.wiki, { id: uid(), title: "New Entry", body: "", category: category || "Uncategorized" }] }));

  const addMoodboardItem = (url, caption) =>
    updateProject((p) => ({ ...p, moodboard: [...(p.moodboard || []), { id: uid(), url: url.trim(), caption: (caption || "").trim() }] }));

  const addScene = (chapter) =>
    updateProject((p) => ({ ...p, scenes: [...p.scenes, { id: uid(), title: `Scene ${p.scenes.length + 1}`, content: "", chapter: chapter || "" }] }), true);

  const moveItem = (collection, id, direction) =>
    updateProject((p) => {
      const items = [...p[collection]];
      const idx = items.findIndex((x) => x.id === id);
      const newIdx = idx + direction;
      if (idx < 0 || newIdx < 0 || newIdx >= items.length) return p;
      [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
      return { ...p, [collection]: items };
    });

  const removeItem = (collection, id) =>
    updateProject((p) => {
      const next = { ...p, [collection]: p[collection].filter((x) => x.id !== id) };
      if (collection === "characters") {
        // strip any relationships on remaining characters that pointed at the one just deleted
        next.characters = next.characters.map((c) => ({
          ...c,
          relationships: (c.relationships || []).filter((r) => r.targetId !== id),
        }));
        // strip any timeline references (POV or involved) that pointed at the one just deleted
        next.timeline = (next.timeline || []).map((ev) => ({
          ...ev,
          povCharId: ev.povCharId === id ? "" : ev.povCharId,
          linkedCharIds: (ev.linkedCharIds || []).filter((cid) => cid !== id),
        }));
      }
      return next;
    }, collection === "scenes");

  const patchItem = (collection, id, patch) =>
    updateProject((p) => ({ ...p, [collection]: p[collection].map((x) => (x.id === id ? { ...x, ...patch } : x)) }), collection === "scenes");

  // Relationships are mirrored: adding "Callum — Love Interest" on Jo also adds
  // "Jo — Love Interest" on Callum. Both entries share a pairId so removing
  // either side removes both.
  const addRelationship = (sourceId, targetId, label) =>
    updateProject((p) => {
      const pairId = uid();
      const characters = p.characters.map((c) => {
        if (c.id === sourceId) return { ...c, relationships: [...(c.relationships || []), { id: uid(), targetId, label, pairId }] };
        if (c.id === targetId) return { ...c, relationships: [...(c.relationships || []), { id: uid(), targetId: sourceId, label, pairId }] };
        return c;
      });
      return { ...p, characters };
    });

  const removeRelationship = (characterId, relId) =>
    updateProject((p) => {
      const char = p.characters.find((c) => c.id === characterId);
      const rel = (char?.relationships || []).find((r) => r.id === relId);
      if (!rel) return p;
      const { pairId } = rel;
      const characters = p.characters.map((c) => ({
        ...c,
        relationships: (c.relationships || []).filter((r) => (pairId ? r.pairId !== pairId : r.id !== relId)),
      }));
      return { ...p, characters };
    });

  const updateMapPositions = (positions) =>
    updateProject((p) => ({ ...p, characterMapPositions: positions }));

  const download = (filename, text, mime = "text/plain") => {
    const blob = new Blob(["\ufeff", text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  const escapeHtml = (s) => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // Splits on blank lines into paragraphs (the normal way prose is separated),
  // and turns single line breaks within a paragraph into <br/>.
  const paragraphsHtml = (text) =>
    (text || "")
      .split(/\n\s*\n/)
      .filter((p) => p.trim())
      .map((p) => `<p style="margin:0 0 12pt 0;">${escapeHtml(p.trim()).replace(/\n/g, "<br/>")}</p>`)
      .join("\n") || `<p style="margin:0 0 12pt 0; color:#888;">(empty)</p>`;

  const exportManuscript = () => {
    if (!project) return;
    let lastChapter = null;
    const parts = [`<h1 style="font-family:Georgia,serif; text-align:center;">${escapeHtml(project.name)}</h1>`];
    if (project.scenes.length === 0) {
      parts.push(`<p>No scenes yet.</p>`);
    }
    project.scenes.forEach((s) => {
      const chapter = (s.chapter || "").trim();
      if (chapter && chapter !== lastChapter) {
        parts.push(`<h1 style="font-family:Georgia,serif; margin-top:36pt; page-break-before:always;">${escapeHtml(chapter)}</h1>`);
        lastChapter = chapter;
      }
      parts.push(`<h2 style="font-family:Georgia,serif; font-size:14pt; margin-top:24pt;">${escapeHtml(s.title)}</h2>`);
      parts.push(paragraphsHtml(s.content));
    });
    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>${escapeHtml(project.name)}</title></head>
<body style="font-family:'Times New Roman',serif; font-size:12pt; line-height:1.6;">
${parts.join("\n")}
</body></html>`;
    download(`${project.name.replace(/\s+/g, "_")}_manuscript.doc`, html, "application/msword");
  };

  const exportBible = () => {
    if (!project) return;
    const chars = project.characters.map((c) => `${c.name}${c.role ? " — " + c.role : ""}\nTraits: ${c.traits || "—"}\n${c.backstory || ""}`).join("\n\n");
    const timeline = project.timeline.map((e) => `${e.date ? "[" + e.date + "] " : ""}${e.title}\n${e.description || ""}`).join("\n\n");
    const wiki = project.wiki.map((w) => `${w.title}\n${w.body || ""}`).join("\n\n");
    const text = `CHARACTERS\n==========\n\n${chars || "—"}\n\n\nTIMELINE\n========\n\n${timeline || "—"}\n\n\nWIKI\n====\n\n${wiki || "—"}`;
    download(`${project.name.replace(/\s+/g, "_")}_story_bible.txt`, text);
  };

  if (loading) {
    return (
      <div style={outerWrap}>
        <FontImport />
        <div style={loadingWrap}><Loader2 size={18} className="animate-spin" style={{ marginRight: 8 }} />Opening the study...</div>
      </div>
    );
  }

  const globalTotalWords = (projects || []).reduce((sum, p) => sum + (p.wordCount || 0), 0);
  const streak = computeStreak(activityLog);

  return (
    <div style={outerWrap}>
      <FontImport />
      {view === "shelf" ? (
        <ShelfView
          projects={projects || []}
          onOpen={openProject}
          creating={creating}
          setCreating={setCreating}
          newName={newName}
          setNewName={setNewName}
          newColor={newColor}
          setNewColor={setNewColor}
          onCreate={handleCreateProject}
          metaEditId={metaEditId}
          setMetaEditId={setMetaEditId}
          onUpdateMeta={updateIndexEntry}
          confirmDeleteId={confirmDeleteId}
          setConfirmDeleteId={setConfirmDeleteId}
          onDelete={handleDelete}
          showArchived={showArchived}
          setShowArchived={setShowArchived}
          globalTotalWords={globalTotalWords}
          streak={streak}
        />
      ) : (
        <WorkspaceView
          project={project}
          onBack={backToShelf}
          tab={tab}
          setTab={setTab}
          editorId={editorId}
          setEditorId={setEditorId}
          saveState={saveState}
          onRename={(name) => {
            updateProject((p) => ({ ...p, name }));
            updateIndexEntry(selectedId, { name });
          }}
          addCharacter={addCharacter}
          addRelationship={addRelationship}
          removeRelationship={removeRelationship}
          updateMapPositions={updateMapPositions}
          addEvent={addEvent}
          insertEvent={insertEvent}
          addWiki={addWiki}
          addMoodboardItem={addMoodboardItem}
          addScene={addScene}
          moveItem={moveItem}
          removeItem={removeItem}
          patchItem={patchItem}
          exportBible={exportBible}
          exportManuscript={exportManuscript}
        />
      )}
    </div>
  );
}

function CharacterMap({ characters, savedPositions, onPositionsChange }) {
  const [positions, setPositions] = useState({});
  const [selectedId, setSelectedId] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [zoom, setZoom] = useState(1);
  const svgRef = useRef(null);
  const positionsRef = useRef({});
  const width = 560, height = 420, cx = width / 2, cy = height / 2;
  const MIN_ZOOM = 0.5, MAX_ZOOM = 2.5;

  const clampZoom = (z) => Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));

  const edges = [];
  const seen = new Set();
  characters.forEach((c) => {
    (c.relationships || []).forEach((r) => {
      if (!characters.find((o) => o.id === r.targetId)) return;
      const key = [c.id, r.targetId].sort().join("|");
      if (seen.has(key)) return;
      seen.add(key);
      edges.push({ key, a: c.id, b: r.targetId, label: r.label });
    });
  });

  // Seeds the map from saved positions. Any character without a saved spot
  // gets placed by a quick force simulation — pulled toward characters it's
  // linked to, pushed away from everyone else — instead of a plain circle
  // that ignores who's actually connected. Characters that already have a
  // saved position stay pinned exactly where they were left.
  useEffect(() => {
    const saved = savedPositions || {};
    const unpositioned = characters.filter((c) => !saved[c.id]);

    if (unpositioned.length === 0) {
      const next = {};
      characters.forEach((c) => { if (saved[c.id]) next[c.id] = saved[c.id]; });
      setPositions(next);
      return;
    }

    const nodes = characters.map((c) => {
      const s = saved[c.id];
      return s ? { id: c.id, x: s.x, y: s.y, fx: s.x, fy: s.y } : { id: c.id };
    });
    const links = edges.map((e) => ({ source: e.a, target: e.b }));
    const sim = d3
      .forceSimulation(nodes)
      .force("link", d3.forceLink(links).id((d) => d.id).distance(115).strength(0.6))
      .force("charge", d3.forceManyBody().strength(-260))
      .force("center", d3.forceCenter(cx, cy))
      .force("collide", d3.forceCollide(38))
      .stop();
    for (let i = 0; i < 300; i++) sim.tick();

    const next = {};
    nodes.forEach((n) => {
      next[n.id] = { x: Math.max(30, Math.min(width - 30, n.x)), y: Math.max(30, Math.min(height - 30, n.y)) };
    });
    setPositions(next);
    onPositionsChange && onPositionsChange(next);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [characters.map((c) => c.id).join(","), edges.map((e) => e.key).join(",")]);

  useEffect(() => {
    positionsRef.current = positions;
  }, [positions]);

  const handlePointerDown = (id) => (e) => {
    e.preventDefault();
    setDragId(id);
    setSelectedId(id);
  };

  // Converts a screen point to the pre-zoom coordinate space the node positions
  // live in. The SVG scales uniformly to fit its box (preserveAspectRatio's
  // default "meet"), which usually leaves horizontal or vertical padding —
  // this accounts for that padding instead of assuming the SVG stretches
  // to exactly fill its container.
  const screenToMapPoint = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const scale = Math.min(rect.width / width, rect.height / height);
    const offsetX = (rect.width - width * scale) / 2;
    const offsetY = (rect.height - height * scale) / 2;
    const outerX = (e.clientX - rect.left - offsetX) / scale;
    const outerY = (e.clientY - rect.top - offsetY) / scale;
    return { x: cx + (outerX - cx) / zoom, y: cy + (outerY - cy) / zoom };
  };

  // Track the drag on window rather than just the SVG element, so a fast
  // mouse movement that briefly leaves the map doesn't drop the drag.
  // Position is persisted once, on release, rather than on every pixel of
  // movement.
  useEffect(() => {
    if (!dragId) return;
    const move = (e) => {
      if (!svgRef.current) return;
      const p = screenToMapPoint(e);
      setPositions((prev) => ({ ...prev, [dragId]: p }));
    };
    const up = () => {
      setDragId(null);
      onPositionsChange && onPositionsChange(positionsRef.current);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [dragId, zoom]);

  const handleWheel = (e) => {
    e.preventDefault();
    setZoom((z) => clampZoom(z + (e.deltaY < 0 ? 0.1 : -0.1)));
  };

  if (characters.length < 2) {
    return (
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 40 }}>
        <p style={{ color: COLORS.inkSoft, fontStyle: "italic", textAlign: "center" }}>
          Add at least two characters and link a relationship between them to see the map.
        </p>
      </div>
    );
  }

  return (
    <div style={{ flex: 1, display: "flex" }}>
      <div style={{ flex: 1, padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <p style={{ fontSize: 12, color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", margin: 0 }}>
            Drag a character to rearrange. Click one to highlight their connections.
          </p>
          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
            <button onClick={() => setZoom((z) => clampZoom(z - 0.2))} style={zoomBtnStyle} title="Zoom out">−</button>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: COLORS.inkSoft, width: 40, textAlign: "center" }}>{Math.round(zoom * 100)}%</span>
            <button onClick={() => setZoom((z) => clampZoom(z + 0.2))} style={zoomBtnStyle} title="Zoom in">+</button>
            <button onClick={() => setZoom(1)} style={{ ...zoomBtnStyle, width: "auto", padding: "0 10px", fontSize: 11 }} title="Reset zoom">Reset</button>
          </div>
        </div>
        <div style={{ width: "100%", height: 420, overflow: "hidden", borderRadius: 8, border: `1px solid ${COLORS.paperLine}` }}>
          <svg
            ref={svgRef}
            viewBox={`0 0 ${width} ${height}`}
            width="100%"
            height="100%"
            style={{ display: "block", background: COLORS.paper, cursor: dragId ? "grabbing" : "default" }}
            onWheel={handleWheel}
            onClick={(e) => { if (e.target === svgRef.current) setSelectedId(null); }}
          >
            <g transform={`translate(${cx} ${cy}) scale(${zoom}) translate(${-cx} ${-cy})`}>
              {edges.map((e) => {
                const a = positions[e.a], b = positions[e.b];
                if (!a || !b) return null;
                const dimmed = selectedId && selectedId !== e.a && selectedId !== e.b;
                const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
                return (
                  <g key={e.key} opacity={dimmed ? 0.18 : 1}>
                    <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={relationshipColor(e.label)} strokeWidth={dimmed ? 1.5 : 2.5} />
                    <rect x={mx - e.label.length * 3.3 - 4} y={my - 9} width={e.label.length * 6.6 + 8} height={16} fill={COLORS.paperRaised} opacity={0.9} rx={3} />
                    <text x={mx} y={my + 3} textAnchor="middle" fontFamily="IBM Plex Mono" fontSize={10} fill={COLORS.inkSoft}>{e.label}</text>
                  </g>
                );
              })}
              {characters.map((c, i) => {
                const p = positions[c.id];
                if (!p) return null;
                const dimmed = selectedId && selectedId !== c.id && !edges.some((e) => e.key.includes(c.id) && (e.a === selectedId || e.b === selectedId) && (e.a === c.id || e.b === c.id));
                return (
                  <g key={c.id} opacity={dimmed ? 0.35 : 1} onMouseDown={handlePointerDown(c.id)} style={{ cursor: "grab" }}>
                    <circle cx={p.x} cy={p.y} r={26} fill={NODE_COLOR} stroke={selectedId === c.id ? COLORS.ink : "none"} strokeWidth={2} />
                    <text x={p.x} y={p.y + 4} textAnchor="middle" fontFamily="Fraunces" fontWeight={600} fontSize={11} fill={COLORS.ink}>
                      {c.name.length > 10 ? c.name.slice(0, 9) + "…" : c.name}
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>
        </div>
      </div>
      <div style={{ width: 160, padding: 16, borderLeft: `1px solid ${COLORS.paperLine}` }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: 10 }}>Legend</div>
        <LegendRow color={COLORS.sage} label="Family" />
        <LegendRow color={COLORS.wine} label="Love Interest" />
        <LegendRow color={COLORS.gold} label="Custom" />
      </div>
    </div>
  );
}

const zoomBtnStyle = {

function CharacterEditor({ c, allChars, onPatch, onDelete, onAddRelationship, onRemoveRelationship }) {

function RelationshipEditor({ c, others, onAdd, onRemove }) {
  const rels = (c.relationships || []).filter((r) => others.some((o) => o.id === r.targetId));
  const [targetId, setTargetId] = useState("");
  const [customLabel, setCustomLabel] = useState("");

  useEffect(() => {
    if (!targetId && others.length > 0) setTargetId(others[0].id);
  }, [others, targetId]);

  const addRel = (label) => {
    if (!targetId || !label.trim()) return;
    onAdd(targetId, label.trim());
    setCustomLabel("");
  };

  const nameFor = (id) => others.find((o) => o.id === id)?.name || "Unknown";

  return (
    <div>
      <p style={{ fontSize: 11, color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", marginTop: -4, marginBottom: 10 }}>
        Relationships show up on both characters automatically.
      </p>
      {rels.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          {rels.map((r) => (
            <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px", borderRadius: 5, background: COLORS.paper, border: `1px solid ${COLORS.paperLine}`, marginBottom: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: relationshipColor(r.label), flexShrink: 0 }} />
              <span style={{ fontSize: 13 }}><strong>{nameFor(r.targetId)}</strong> — {r.label}</span>
              <button onClick={() => onRemove(r.id)} style={{ marginLeft: "auto", background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer" }}><X size={13} /></button>
            </div>
          ))}
        </div>
      )}

      {others.length === 0 ? (
        <p style={{ fontSize: 13, color: COLORS.inkSoft }}>Add other characters first to link them here.</p>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: "10px 12px", borderRadius: 6, border: `1px dashed ${COLORS.paperLine}` }}>
          <select value={targetId} onChange={(e) => setTargetId(e.target.value)} style={{ ...inputStyle, fontSize: 13 }}>
            {others.map((o) => <option key={o.id} value={o.id}>{o.name}</option>)}
          </select>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
            {RELATIONSHIP_PRESETS.map((p) => (
              <button key={p} onClick={() => addRel(p)} style={{ ...exportBtnStyle, borderColor: relationshipColor(p), color: relationshipColor(p) }}>+ {p}</button>
            ))}
            <input
              value={customLabel}
              onChange={(e) => setCustomLabel(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addRel(customLabel)}
              placeholder="Or type a custom relation…"
              style={{ ...inputStyle, fontSize: 13, width: 160 }}
            />
            <button onClick={() => addRel(customLabel)} style={exportBtnStyle}>Add</button>
          </div>
        </div>
      )}
    </div>
  );
}

        <select value={e.povCharId || ""} onChange={(ev) => onPatch({ povCharId: ev.target.value })} style={{ ...inputStyle, fontSize: 14 }}>

      </Field>

function InvolvedEditor({ e, allChars, onPatch }) {
  const [search, setSearch] = useState("");
  const linkedIds = e.linkedCharIds || [];
  const linkedChars = allChars.filter((c) => linkedIds.includes(c.id));
  const candidates = allChars.filter((c) => !linkedIds.includes(c.id) && c.name.toLowerCase().includes(search.toLowerCase()));

  const add = (id) => {
    onPatch({ linkedCharIds: [...linkedIds, id] });
    setSearch("");
  };
  const remove = (id) => onPatch({ linkedCharIds: linkedIds.filter((x) => x !== id) });

  if (allChars.length === 0) {
    return <p style={{ fontSize: 13, color: COLORS.inkSoft }}>Add characters first to link them to events.</p>;
  }

  return (
    <div>
      {linkedChars.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
          {linkedChars.map((c) => (
            <span key={c.id} style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, padding: "4px 6px 4px 10px", borderRadius: 999, background: COLORS.wine, color: COLORS.ink }}>
              {c.name}
              <button onClick={() => remove(c.id)} style={{ background: "none", border: "none", color: COLORS.ink, cursor: "pointer", display: "flex", padding: 0 }}><X size={12} /></button>
            </span>
          ))}
        </div>
      )}

      <div style={{ position: "relative" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, ...inputStyle, padding: "6px 10px" }}>
          <Search size={13} color={COLORS.inkSoft} />
          <input
            value={search}
            onChange={(ev) => setSearch(ev.target.value)}
            placeholder="Search characters to add…"
            style={{ border: "none", outline: "none", background: "transparent", fontFamily: "'Source Serif 4', serif", fontSize: 14, flex: 1 }}
          />
        </div>
        {search && (
          <div style={{ border: `1px solid ${COLORS.paperLine}`, borderRadius: 4, marginTop: 4, maxHeight: 160, overflowY: "auto", background: COLORS.paperRaised }}>
            {candidates.length === 0 ? (
              <p style={{ fontSize: 12, color: COLORS.inkSoft, padding: "8px 10px", margin: 0 }}>No matches.</p>
            ) : (
              candidates.map((c) => (
                <div key={c.id} onClick={() => add(c.id)} style={{ padding: "8px 10px", cursor: "pointer", fontSize: 13, borderBottom: `1px solid ${COLORS.paperLine}` }}>
                  {c.name}
                </div>
              ))
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function WikiSection({ project, addWiki, editorId, setEditorId, patchItem, removeItem }) {
  const [collapsed, setCollapsed] = useState({});
  const entries = project.wiki || [];
  const categories = Array.from(new Set(entries.map((e) => e.category || "Uncategorized"))).sort((a, b) => {
    if (a === "Uncategorized") return 1;
    if (b === "Uncategorized") return -1;
    return a.localeCompare(b);
  });
  const selected = entries.find((e) => e.id === editorId);
  const toggle = (cat) => setCollapsed((prev) => ({ ...prev, [cat]: !prev[cat] }));

  return (
    <>
      <div className="atelier-scroll" style={{ width: 260, borderRight: `1px solid ${COLORS.paperLine}`, padding: 16, overflowY: "auto" }}>
        <button
          onClick={() => addWiki()}
          style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, padding: "8px 0", marginBottom: 12, borderRadius: 4, border: `1px dashed ${COLORS.paperLine}`, background: "transparent", color: COLORS.wine, cursor: "pointer" }}
        >
          <Plus size={13} /> New entry
        </button>
        {entries.length === 0 && <p style={{ fontSize: 13, color: COLORS.inkSoft, fontStyle: "italic" }}>Nothing here yet.</p>}
        {categories.map((cat) => {
          const items = entries.filter((e) => (e.category || "Uncategorized") === cat);
          const isCollapsed = !!collapsed[cat];
          return (
            <div key={cat} style={{ marginBottom: 10 }}>
              <div
                onClick={() => toggle(cat)}
                style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", padding: "6px 4px", borderRadius: 4 }}
              >
                {isCollapsed ? <ChevronRight size={13} color={COLORS.sage} /> : <ChevronDown size={13} color={COLORS.sage} />}
                <Folder size={13} color={COLORS.sage} />
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em", color: COLORS.inkSoft, flex: 1 }}>
                  {cat}
                </span>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: COLORS.inkSoft }}>{items.length}</span>
                <button
                  onClick={(e) => { e.stopPropagation(); addWiki(cat); }}
                  title={`New entry in ${cat}`}
                  style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", display: "flex", padding: 2 }}
                >
                  <Plus size={12} />
                </button>
              </div>
              {!isCollapsed && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 4, marginLeft: 19, borderLeft: `1px dashed ${COLORS.paperLine}`, paddingLeft: 10 }}>
                  {items.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => setEditorId(item.id)}
                      style={{ padding: "8px 10px", borderRadius: 5, cursor: "pointer", background: editorId === item.id ? COLORS.paper : "transparent", border: `1px solid ${editorId === item.id ? COLORS.paperLine : "transparent"}` }}
                    >
                      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 14, fontWeight: 600 }}>{item.title}</div>
                      <div style={{ fontSize: 11, color: COLORS.inkSoft, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.body || "Empty entry"}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="atelier-scroll" style={{ flex: 1, padding: 24, overflowY: "auto" }}>
        {selected ? (
          <WikiEditor
            key={selected.id}
            w={selected}
            categories={categories}
            onPatch={(patch) => patchItem("wiki", selected.id, patch)}
            onDelete={() => { removeItem("wiki", selected.id); setEditorId(null); }}
          />
        ) : (
          <p style={{ color: COLORS.inkSoft, fontStyle: "italic" }}>Select something on the left, or add a new one.</p>
        )}
      </div>
    </>
  );
}

function WikiEditor({ w, onPatch, onDelete, categories = [] }) {
  return (
    <div style={{ maxWidth: 560 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start" }}>
        <input value={w.title} onChange={(e) => onPatch({ title: e.target.value })} style={{ ...inputStyle, fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600, border: "none", background: "transparent", padding: 0 }} />
        <button onClick={onDelete} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer" }}><X size={16} /></button>
      </div>
      <Field label={<span style={{ display: "flex", alignItems: "center", gap: 4 }}><Folder size={12} /> Category</span>}>
        <CategoryField value={w.category} categories={categories} onChange={(cat) => onPatch({ category: cat })} />
      </Field>
      <Field label="Notes"><AutoGrowTextarea value={w.body} onChange={(e) => onPatch({ body: e.target.value })} minHeight={220} /></Field>
    </div>
  );
}

function CategoryField({ value, categories, onChange, emptyValue = "Uncategorized", placeholder = "e.g. Locations, Lore, Magic System" }) {
  const [text, setText] = useState(value || emptyValue);

  useEffect(() => {
    setText(value || emptyValue);
  }, [value, emptyValue]);

  const commit = (v) => {
    const clean = (v || "").trim() || emptyValue;
    setText(clean);
    if (clean !== (value || emptyValue)) onChange(clean);
  };

  const suggestions = categories.filter((c) => c.toLowerCase() !== (text || "").trim().toLowerCase());

  return (
    <div>
      <input
        value={text}
        onChange={(e) => setText(e.target.value)}
        onBlur={() => commit(text)}
        onKeyDown={(e) => { if (e.key === "Enter") { commit(text); e.currentTarget.blur(); } }}
        style={inputStyle}
        placeholder={placeholder}
      />
      {suggestions.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
          {suggestions.map((c) => (
            <button key={c} onClick={() => commit(c)} style={{ ...exportBtnStyle, color: COLORS.sage, borderColor: COLORS.sage }}>
              {c}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function MoodboardPane({ project, onAdd, onRemove, onMove }) {
  const [url, setUrl] = useState("");
  const [caption, setCaption] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const fileInputRef = useRef(null);
  const captionRef = useRef(caption);
  captionRef.current = caption;
  const items = project.moodboard || [];

  const submitUrl = () => {
    if (!url.trim()) return;
    onAdd(url.trim(), caption);
    setUrl("");
    setCaption("");
  };

  const handleFile = async (file) => {
    if (!file || !file.type.startsWith("image/")) return;
    setBusy(true);
    setError("");
    try {
      const dataUrl = await compressImageToDataURL(file);
      onAdd(dataUrl, captionRef.current);
      setCaption("");
    } catch (e) {
      console.error("Failed to process image", e);
      setError("Couldn't process that image — try a different file.");
    } finally {
      setBusy(false);
    }
  };

  // Lets you paste an image straight from your clipboard (e.g. copied from
  // another site or a screenshot) anywhere while this tab is open — except
  // inside the text fields, where a normal text paste should just work.
  useEffect(() => {
    const onPaste = (e) => {
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      const clipItems = e.clipboardData?.items;
      if (!clipItems) return;
      for (const it of clipItems) {
        if (it.type && it.type.startsWith("image/")) {
          const file = it.getAsFile();
          if (file) {
            e.preventDefault();
            handleFile(file);
          }
          return;
        }
      }
      // Nothing image-shaped was found — this is common when a site (Pinterest
      // included) only puts a link on the clipboard rather than actual pixels.
      setError('No image found in your clipboard — on Pinterest, right-click the image and choose "Copy Image" (not "Copy Image Address"), then paste again.');
    };
    window.addEventListener("paste", onPaste);
    return () => window.removeEventListener("paste", onPaste);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div className="atelier-scroll" style={{ flex: 1, padding: 24, overflowY: "auto" }}>
      <p style={{ fontSize: 12, color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", marginBottom: 18, maxWidth: 560 }}>
        Upload a photo, paste one straight from your clipboard (Ctrl/Cmd+V), or paste a direct image link — though some sites (Pinterest included) block linked images from showing elsewhere, so upload or paste is the more reliable option.
      </p>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px, 1fr))", gap: 14 }}>
        <div style={{ border: `1px dashed ${COLORS.paperLine}`, borderRadius: 8, padding: 14, display: "flex", flexDirection: "column", gap: 8, justifyContent: "center", aspectRatio: "1" }}>
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            style={{ display: "none" }}
            onChange={(e) => { handleFile(e.target.files?.[0]); e.target.value = ""; }}
          />
          <button
            onClick={() => fileInputRef.current?.click()}
            disabled={busy}
            style={{ ...exportBtnStyle, justifyContent: "center", color: COLORS.wine, borderColor: COLORS.wine }}
          >
            {busy ? "Adding…" : <><Plus size={12} /> Upload photo</>}
          </button>
          <div style={{ fontSize: 10, color: COLORS.inkSoft, textAlign: "center", fontFamily: "'IBM Plex Mono', monospace" }}>or paste with Ctrl/Cmd+V</div>
          <input value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="Caption (optional)" style={{ ...inputStyle, fontSize: 12, padding: "6px 8px" }} />
          {error && <div style={{ fontSize: 10, color: COLORS.wine }}>{error}</div>}
          <StitchDivider />
          <input value={url} onChange={(e) => setUrl(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitUrl()} placeholder="Or paste an image link" style={{ ...inputStyle, fontSize: 11, padding: "5px 7px" }} />
          <button onClick={submitUrl} style={{ ...exportBtnStyle, justifyContent: "center", fontSize: 10 }}>Add link</button>
        </div>
        {items.map((item, i) => (
          <MoodboardCard
            key={item.id}
            item={item}
            onRemove={() => onRemove(item.id)}
            onMove={(dir) => onMove(item.id, dir)}
            isFirst={i === 0}
            isLast={i === items.length - 1}
          />
        ))}
      </div>
      {items.length === 0 && (
        <p style={{ fontSize: 13, color: COLORS.inkSoft, fontStyle: "italic", marginTop: 16 }}>Nothing pinned yet — upload, paste, or link an image above to get started.</p>
      )}
    </div>
  );
}

function MoodboardCard({ item, onRemove, onMove, isFirst, isLast }) {
  const [broken, setBroken] = useState(false);
  const navBtnStyle = (disabled) => ({
    width: 20, height: 20, borderRadius: "50%", background: "rgba(43,42,40,0.6)", border: "none",
    color: "#fff", cursor: disabled ? "default" : "pointer", display: "flex", alignItems: "center",
    justifyContent: "center", opacity: disabled ? 0.35 : 1,
  });
  return (
    <div style={{ position: "relative", aspectRatio: "1", borderRadius: 8, overflow: "hidden", border: `1px solid ${COLORS.paperLine}`, background: COLORS.paper }}>
      {broken ? (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", padding: 10, textAlign: "center", gap: 6 }}>
          <ImageOff size={20} color={COLORS.inkSoft} />
          <span style={{ fontSize: 10, color: COLORS.inkSoft, wordBreak: "break-all" }}>Couldn't load this image</span>
        </div>
      ) : (
        <img src={item.url} alt={item.caption || ""} onError={() => setBroken(true)} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
      )}
      <div style={{ position: "absolute", top: 6, left: 6, display: "flex", gap: 3 }}>
        <button onClick={() => !isFirst && onMove(-1)} disabled={isFirst} title="Move earlier" style={navBtnStyle(isFirst)}>
          <ChevronLeft size={12} />
        </button>
        <button onClick={() => !isLast && onMove(1)} disabled={isLast} title="Move later" style={navBtnStyle(isLast)}>
          <ChevronRight size={12} />
        </button>
      </div>
      <button
        onClick={onRemove}
        style={{ position: "absolute", top: 6, right: 6, width: 22, height: 22, borderRadius: "50%", background: "rgba(43,42,40,0.6)", border: "none", color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}
      >
        <X size={12} />
      </button>
      {item.caption && !broken && (
        <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "rgba(43,42,40,0.65)", color: "#fff", fontSize: 11, padding: "4px 8px", fontFamily: "'IBM Plex Mono', monospace" }}>
          {item.caption}
        </div>
      )}
    </div>
  );
}

function ManuscriptPane({ project, editorId, setEditorId, onAdd, onPatch, onDelete, onMove }) {
  const [collapsed, setCollapsed] = useState({});
  const scenes = project.scenes;
  const scene = scenes.find((s) => s.id === editorId);
  const hasChapters = scenes.some((s) => (s.chapter || "").trim());
  const allChapters = Array.from(new Set(scenes.map((s) => (s.chapter || "").trim()).filter(Boolean)));

  const toggle = (key) => setCollapsed((prev) => ({ ...prev, [key]: !prev[key] }));

  const SceneRow = ({ s, i }) => (
    <div key={s.id} onClick={() => setEditorId(s.id)} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 8px 8px 12px", borderRadius: 5, cursor: "pointer", marginBottom: 6, background: editorId === s.id ? COLORS.paper : "transparent", border: `1px solid ${editorId === s.id ? COLORS.paperLine : "transparent"}` }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 15, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.title}</div>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: COLORS.inkSoft }}>{countWords(s.content)} words</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", flexShrink: 0 }}>
        <button
          onClick={(e) => { e.stopPropagation(); onMove(s.id, -1); }}
          disabled={i === 0}
          title="Move up"
          style={{ background: "none", border: "none", color: i === 0 ? COLORS.paperLine : COLORS.inkSoft, cursor: i === 0 ? "default" : "pointer", padding: 1, lineHeight: 0 }}
        >
          <ChevronUp size={14} />
        </button>
        <button
          onClick={(e) => { e.stopPropagation(); onMove(s.id, 1); }}
          disabled={i === scenes.length - 1}
          title="Move down"
          style={{ background: "none", border: "none", color: i === scenes.length - 1 ? COLORS.paperLine : COLORS.inkSoft, cursor: i === scenes.length - 1 ? "default" : "pointer", padding: 1, lineHeight: 0 }}
        >
          <ChevronDown size={14} />
        </button>
      </div>
    </div>
  );

  // Groups are keyed by chapter, ordered by first appearance in the manuscript
  // (not alphabetically — story order matters more than alphabetical order
  // here). Scenes with no chapter set fall into an unlabeled bucket.
  let groupKeys = [];
  if (hasChapters) {
    scenes.forEach((s) => {
      const key = (s.chapter || "").trim() || "__none__";
      if (!groupKeys.includes(key)) groupKeys.push(key);
    });
  }

  return (
    <>
      <div className="atelier-scroll" style={{ width: 250, borderRight: `1px solid ${COLORS.paperLine}`, padding: 16, overflowY: "auto" }}>
        <button onClick={() => onAdd()} style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, padding: "8px 0", marginBottom: 12, borderRadius: 4, border: `1px dashed ${COLORS.paperLine}`, background: "transparent", color: COLORS.wine, cursor: "pointer" }}>
          <Plus size={13} /> New scene
        </button>

        {!hasChapters ? (
          scenes.map((s, i) => <SceneRow key={s.id} s={s} i={i} />)
        ) : (
          groupKeys.map((key) => {
            const label = key === "__none__" ? "No chapter" : key;
            const items = scenes.filter((s) => ((s.chapter || "").trim() || "__none__") === key);
            const isCollapsed = !!collapsed[key];
            return (
              <div key={key} style={{ marginBottom: 10 }}>
                <div onClick={() => toggle(key)} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", padding: "6px 4px", borderRadius: 4 }}>
                  {isCollapsed ? <ChevronRight size={13} color={COLORS.sage} /> : <ChevronDown size={13} color={COLORS.sage} />}
                  <Folder size={13} color={COLORS.sage} />
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em", color: COLORS.inkSoft, flex: 1 }}>{label}</span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: COLORS.inkSoft }}>{items.length}</span>
                  {key !== "__none__" && (
                    <button
                      onClick={(e) => { e.stopPropagation(); onAdd(key); }}
                      title={`New scene in ${label}`}
                      style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", display: "flex", padding: 2 }}
                    >
                      <Plus size={12} />
                    </button>
                  )}
                </div>
                {!isCollapsed && (
                  <div style={{ marginLeft: 19, borderLeft: `1px dashed ${COLORS.paperLine}`, paddingLeft: 10 }}>
                    {items.map((s) => <SceneRow key={s.id} s={s} i={scenes.indexOf(s)} />)}
                  </div>
                )}
              </div>
            );
          })
        )}
      </div>

      <div className="atelier-scroll" style={{ flex: 1, padding: 24, overflowY: "auto" }}>
        {!scene ? <p style={{ color: COLORS.inkSoft, fontStyle: "italic" }}>Select a scene, or start a new one.</p> : (
          <div style={{ maxWidth: 640 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start" }}>
              <input value={scene.title} onChange={(e) => onPatch(scene.id, { title: e.target.value })} style={{ ...inputStyle, fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600, border: "none", background: "transparent", padding: 0 }} />
              <button onClick={() => onDelete(scene.id)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer" }}><X size={16} /></button>
            </div>
            <div style={{ marginTop: 10, marginBottom: 14, maxWidth: 300 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>
                <Folder size={11} /> Chapter (optional)
              </div>
              <CategoryField
                value={scene.chapter}
                categories={allChapters}
                emptyValue=""
                placeholder="e.g. Chapter One"
                onChange={(chapter) => onPatch(scene.id, { chapter })}
              />
            </div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: COLORS.inkSoft, marginBottom: 10 }}>{countWords(scene.content)} words</div>
            <textarea className="atelier-textarea" value={scene.content} onChange={(e) => onPatch(scene.id, { content: e.target.value })} placeholder="Write here. This is the shape does not matter part — half a scene, three lines, a full chapter, all fine." style={{ ...inputStyle, minHeight: 420, resize: "vertical", fontSize: 16, lineHeight: 1.7 }} />
          </div>
        )}
      </div>
    </>
  );
}

/* ---------------- ANALYTICS (per project) ---------------- */

function AnalyticsPane({ project }) {
  const totalWords = totalWordsForProject(project);
  const sceneCount = project.scenes.length;
  const avgWords = sceneCount ? Math.round(totalWords / sceneCount) : 0;
  const history = [...(project.history || [])].sort((a, b) => (a.date < b.date ? -1 : 1));
  const last = history[history.length - 1];
  const prev = history[history.length - 2];
  const wordsToday = last ? (prev ? last.words - prev.words : last.words) : 0;

  const sceneData = project.scenes.map((s) => ({
    name: s.title.length > 14 ? s.title.slice(0, 14) + "…" : s.title,
    words: countWords(s.content),
  }));

  const chartDate = (d) => {
    const parts = d.split("-");
    return `${parts[1]}/${parts[2]}`;
  };

  return (
    <div className="atelier-scroll" style={{ flex: 1, padding: 24, overflowY: "auto" }}>
      <div style={{ display: "flex", gap: 12, marginBottom: 28, flexWrap: "wrap" }}>
        <StatCard label="Total words" value={totalWords.toLocaleString()} />
        <StatCard label="Scenes" value={sceneCount} />
        <StatCard label="Avg words / scene" value={avgWords.toLocaleString()} />
        <StatCard label="Written today" value={Math.max(wordsToday, 0).toLocaleString()} accent />
      </div>

      <div style={{ marginBottom: 32 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase", color: COLORS.wine, marginBottom: 10 }}>Words over time</div>
        {history.length < 2 ? (
          <p style={{ fontSize: 13, color: COLORS.inkSoft, fontStyle: "italic" }}>Keep writing across a couple of days and this will start to fill in.</p>
        ) : (
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={history.map((h) => ({ ...h, label: chartDate(h.date) }))}>
              <CartesianGrid stroke={COLORS.paperLine} strokeDasharray="3 3" />
              <XAxis dataKey="label" tick={{ fontFamily: "IBM Plex Mono", fontSize: 11, fill: COLORS.inkSoft }} axisLine={{ stroke: COLORS.paperLine }} tickLine={false} />
              <YAxis tick={{ fontFamily: "IBM Plex Mono", fontSize: 11, fill: COLORS.inkSoft }} axisLine={{ stroke: COLORS.paperLine }} tickLine={false} />
              <Tooltip contentStyle={{ background: COLORS.paperRaised, border: `1px solid ${COLORS.paperLine}`, borderRadius: 6, fontFamily: "Source Serif 4" }} />
              <Line type="monotone" dataKey="words" stroke={COLORS.wine} strokeWidth={2} dot={{ r: 3, fill: COLORS.wine }} />
            </LineChart>
          </ResponsiveContainer>
        )}
      </div>

      <div>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase", color: COLORS.sage, marginBottom: 10 }}>Words per scene</div>
        {sceneData.length === 0 ? (
          <p style={{ fontSize: 13, color: COLORS.inkSoft, fontStyle: "italic" }}>Add scenes in the Manuscript tab to see this.</p>
        ) : (
          <ResponsiveContainer width="100%" height={Math.max(180, sceneData.length * 34)}>
            <BarChart data={sceneData} layout="vertical" margin={{ left: 10 }}>
              <CartesianGrid stroke={COLORS.paperLine} strokeDasharray="3 3" horizontal={false} />
              <XAxis type="number" tick={{ fontFamily: "IBM Plex Mono", fontSize: 11, fill: COLORS.inkSoft }} axisLine={{ stroke: COLORS.paperLine }} tickLine={false} />
              <YAxis type="category" dataKey="name" width={110} tick={{ fontFamily: "Source Serif 4", fontSize: 12, fill: COLORS.ink }} axisLine={{ stroke: COLORS.paperLine }} tickLine={false} />
              <Tooltip contentStyle={{ background: COLORS.paperRaised, border: `1px solid ${COLORS.paperLine}`, borderRadius: 6, fontFamily: "Source Serif 4" }} />
              <Bar dataKey="words" fill={COLORS.sage} radius={[0, 3, 3, 0]} />
            </BarChart>
          </ResponsiveContainer>
        )}
      </div>
    </div>
  );
}

function StatCard({ label, value, accent }) {
  return (
    <div style={{ padding: "12px 18px", borderRadius: 6, background: COLORS.paper, border: `1px solid ${COLORS.paperLine}`, minWidth: 120 }}>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 700, color: accent ? COLORS.wine : COLORS.ink }}>{value}</div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.05em", textTransform: "uppercase", color: COLORS.inkSoft }}>{label}</div>
    </div>
  );
}
